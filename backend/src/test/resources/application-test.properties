# Active for the "test" profile (see @ActiveProfiles("test")).
#
# The datasource is supplied at runtime by the Testcontainers pgvector
# container in TestcontainersConfiguration via @ServiceConnection, so no
# spring.datasource.* settings belong here.

# No real OpenAI call is made during context-load tests, but the starter
# needs a non-blank key to build its client bean.
spring.ai.openai.api-key=test-key-not-used

# HMAC secret for the JWT encoder/decoder beans (>= 32 chars).
app.auth.jwt-secret=test-only-jwt-secret-that-is-definitely-long-enough-0123456789
app.auth.jwt-ttl-seconds=3600

# Keep the schema bootstrap that production relies on.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.flyway.enabled=true

# Redis is optional; the rate limiter and usage guard fall back to
# in-memory state when it is unreachable during tests.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

logging.level.com.reverseengineer=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
