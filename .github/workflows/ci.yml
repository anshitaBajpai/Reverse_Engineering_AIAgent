name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Runs every test, including the Testcontainers ones (Postgres + Redis):
      # the runner has Docker, and RequiresDocker never skips them when CI is set.
      # api.version: Testcontainers 1.20's Docker client fails on Docker 29+ without it.
      - run: mvn -B verify -Dapi.version=1.44
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No lockfile is committed (package-lock.json is gitignored), so npm ci can't be used.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
